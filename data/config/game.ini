# AI settings are reloaded whenever the title scene opens.
# Sections use the legacy INIDat format: >SectionName
# Neural ordering expects an NNDXMODL model with 128 inputs and 64 outputs.
# It is disabled until a trained Othello model is placed at the configured path.
# Search statistics are appended as CSV when enabled for the selected difficulty.

>Easy
depth=3
exact_endgame_empty=8
time_limit_ms=3000
minimum_thinking_ms=600
maximum_thinking_ms=800
neural_ordering_enabled=false
neural_model_path=data/model/othello_ordering.model
neural_ordering_minimum_depth=4
search_statistics_enabled=false
search_statistics_path=data/log/search_statistics.csv

